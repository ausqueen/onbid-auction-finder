# WebSocket 업그레이드 매핑 (Portainer 콘솔/실시간 통계용)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 버전 정보 노출 숨김 (Server: nginx/x.y.z → nginx) — 2026-07-08 보안 하드닝
server_tokens off;

server {
    listen 80;
    server_name wonrealty.kr www.wonrealty.kr;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wonrealty.kr www.wonrealty.kr;
    ssl_certificate     /etc/letsencrypt/live/wonrealty.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonrealty.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    client_max_body_size 50M;
    proxy_read_timeout   300s;

    location /health {
        proxy_pass http://backend:8001/health;
    }

    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
    }

    # 콘텐츠 해시 자산(/assets/index-XXXX.js·css): 파일명이 바뀌므로 불변 장기 캐시
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html은 항상 재검증 → 재빌드 시 새 번들 즉시 반영(옛 화면 캐싱 방지)
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }
}

# ===== Portainer 완전 제거 완료 (2026-07-25) =====
# 컨테이너·443 프록시·80 acme 블록 모두 삭제. 인증서 SAN에서도 portainer.wonrealty.kr 제외
# (wonrealty.kr lineage = wonrealty.kr / www / blog 3도메인, 만료 2026-10-23).
# DNS A 레코드(가비아)도 삭제 예정 → portainer.wonrealty.kr 는 더 이상 이 서버에서 처리하지 않음.

# ===== hsrealty.co.kr → WordPress/WooCommerce (hsrealty-wp:80) =====
server {
    listen 80;
    server_name hsrealty.co.kr www.hsrealty.co.kr;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hsrealty.co.kr www.hsrealty.co.kr;
    ssl_certificate     /etc/letsencrypt/live/hsrealty.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hsrealty.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    # 보안 헤더 + 버전 숨김 (2026-07-08 하드닝)
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Powered-By;
    client_max_body_size 128M;
    proxy_read_timeout   300s;

    # XML-RPC 차단 (브루트포스 증폭/핑백 DDoS 벡터 제거)
    location = /xmlrpc.php { deny all; }
    # 버전/정보 노출 파일 차단
    location ~* /(readme\.html|license\.txt|wp-config\.php|wp-config-sample\.php)$ { deny all; }

    # ── 업로드 경로 PHP 실행 차단 (2026-07-25) ──
    #    uploads 는 외부 입력이 파일로 떨어지는 유일한 쓰기 경로. 여기서 PHP가 실행되면
    #    "업로드 취약점 → 원격코드실행(RCE)" 체인이 성립하므로 원천 차단(정상 기능 영향 없음).
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phps|php[0-9])$ { deny all; }

    # ── 백업/로그 잔재 파일 차단 (2026-07-25) ──
    #    functions.php.bak.20260722 같은 파일은 최종 확장자가 .php 가 아니라 PHP로 파싱되지 않고
    #    "소스 원문"이 그대로 전송됨. hs-auth-fail.log(관리자 ID·신뢰 IP 노출)도 여기서 차단.
    location ~* \.(bak|old|orig|save|swp|swo|sql|log)($|\.) { deny all; }
    location ~ ~$ { deny all; }

    # ── 운영 스크립트 폴더 차단 (2026-07-25) ──
    #    /hsrealty-import/ 는 wp-cli(`wp eval-file`) 전용 스크립트 모음인데 웹루트 안에 있어
    #    누구나 HTTP로 실행 요청이 가능했음. wp-cli 경로는 nginx를 거치지 않으므로 영향 없음.
    location ^~ /hsrealty-import/ { deny all; }

    # ── WP 관리자 IP 제한 (2026-07-08) : 신뢰 고정 IP만 wp-login/wp-admin 접근 ──
    # admin-ajax.php 는 스토어프론트(장바구니/결제 AJAX)가 쓰므로 공개 유지(정확일치=최우선)
    location = /wp-admin/admin-ajax.php {
        proxy_pass         http://hsrealty-wp:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
    }
    # WP 백엔드 로그인 (고객 로그인은 /my-account/ 이므로 영향 없음)
    location = /wp-login.php {
        allow 116.41.161.23;      # 사용자 고정 회선
        allow 58.225.109.232;     # 추가 신뢰 IP
        deny  all;
        proxy_pass         http://hsrealty-wp:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
    }
    # WP 관리자 화면 전체
    location ^~ /wp-admin/ {
        allow 116.41.161.23;
        allow 58.225.109.232;
        deny  all;
        proxy_pass         http://hsrealty-wp:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
    }

    location / {
        proxy_pass         http://hsrealty-wp:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

