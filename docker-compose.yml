services:
  backend:
    build: ./backend
    container_name: onbid-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      # ⚠️ 디렉터리 마운트 — DB의 -wal/-shm 이 호스트에 상주해야 재빌드 시 WAL 유실 방지(#20 수정).
      # DB 경로는 .env DB_URL=sqlite:////app/data/onbid.db 로 지정.
      - ./data:/app/data
      - ./data/tmp_downloads:/app/tmp_downloads
    expose:
      - "8001"
    # /health 헬스체크 (컨테이너 python 사용). 로그 무제한 누적 방지, 메모리 상한(hsrealty 등 이웃 보호).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine   # 2026-07-25: 1.27-alpine 은 태그 자체가 2025-04-16 이후 갱신 중단(1.27.5) → stable(1.30.x)로 이동
    container_name: onbid-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/wonrealty.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: onbid-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - certbot
